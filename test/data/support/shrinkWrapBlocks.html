<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en" dir="ltr" id="html">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<style>
		* {
			-webkit-box-sizing: border-box;
			-moz-box-sizing:    border-box;
			box-sizing:         border-box;
		}
	</style>
</head>
<body>
	<div>
		<script src="../../jquery.js"></script>
	</div>
	<script>
		// Removes a timing race: this frame is mounted off-screen and can still be
		// unlaid-out at load, where every offsetWidth inside it reads 0 and
		// shrinkWrapBlocks() misreads that as shrink-wrapping. Its value is
		// memoized on the first call, so wait for real layout before calling it.
		jQuery( window ).on( "load", function() {
			var sentinel = document.createElement( "div" );

			sentinel.style.cssText = "width:10px;height:10px";
			document.body.appendChild( sentinel );

			(function waitForLayout( tries ) {
				if ( sentinel.offsetWidth !== 10 && tries > 0 ) {
					window.setTimeout(function() {
						waitForLayout( tries - 1 );
					}, 50 );
					return;
				}
				document.body.removeChild( sentinel );
				window.parent.iframeCallback( jQuery.support.shrinkWrapBlocks() );
			})( 100 );
		});
	</script>
</body>
</html>
